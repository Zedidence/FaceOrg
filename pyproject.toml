[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceorganizer"
version = "0.2.0"
description = "Detect, cluster, and organize photos by the faces in them — native desktop app"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "onnxruntime>=1.16.0",
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "Flask>=3.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-directml>=1.16.0"]
cuda = ["onnxruntime-gpu>=1.16.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=5.0.0", "ruff>=0.3.0", "pyinstaller>=6.0.0"]

[project.scripts]
faceorganizer = "faceorganizer.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E4/E7/E9/F: pyflakes + pycodestyle error subset (the previous baseline).
# I: import sorting. UP: modernize syntax for the declared min Python (3.10).
# B: flake8-bugbear, catches real bugs (mutable defaults, bare raises, etc.)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Excluded from the coverage gate: Qt UI (needs pytest-qt/a display), QThread
# workers (need a Qt event loop), the face detector/scanner (need real ONNX
# models + images), hardware probing, and the GUI entry point. None of these
# are tested today; the gate below covers the rest of the codebase, which is
# plain, testable business logic (database, clustering, actions, CLI, web).
omit = [
    "*/faceorganizer/__main__.py",
    "*/faceorganizer/hardware.py",
    "*/faceorganizer/ui/*",
    "*/faceorganizer/workers/*",
    "*/faceorganizer/scanner/*",
]
